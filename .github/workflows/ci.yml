name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t saha-pusulasi:ci .
      - run: docker run --rm saha-pusulasi:ci python -c "from sahapusulasi.api import app; print(app.title)"
