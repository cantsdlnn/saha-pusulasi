[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saha-pusulasi"
version = "1.0.0"
description = "SLA, beceri, kapasite ve mesafeyi açıklayan saha işi planlama demonstrasyonu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nusret Can Taşdelen" }]
dependencies = ["fastapi>=0.118,<1", "uvicorn[standard]>=0.37,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["sahapusulasi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sahapusulasi --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
